<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- Streamlitとの通信用ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@1.3.0/dist/streamlit.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: white; }
        table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 11px; }
        th, td { border: 1px solid #e2e8f0; padding: 4px; text-align: center; }
        th { background-color: #f8fafc; font-weight: bold; }
        .col-teacher { width: 90px; text-align: left; padding-left: 8px; font-size: 12px; }
        
        /* 🎯 ドロップ先のセルのスタイル */
        .drop-zone { height: 45px; vertical-align: top; background-color: #ffffff; padding: 2px; transition: background-color 0.2s; }
        .drop-zone.drag-over { background-color: #e2e8f0; border: 2px dashed #3b82f6; }
        
        /* 👤 ドラッグできる生徒バッジのスタイル */
        .student-badge {
            background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd;
            padding: 3px; margin-bottom: 2px; border-radius: 4px;
            font-weight: bold; cursor: grab; display: block;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .student-badge:active { cursor: grabbing; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="board-container"></div>

    <script>
        let lessonsData = []; // Pythonから受け取る授業データ

        // 🎨 1. 時間割表をHTMLとして描画する関数
        function renderBoard(data) {
            lessonsData = data.lessons;
            const container = document.getElementById("board-container");
            let html = `<table><tr><th rowspan="2" class="col-teacher">講師名</th>`;
            
            // ヘッダー（日付とコマ）
            data.dates.forEach(d => {
                html += `<th colspan="${data.slots.length}">${d}</th>`;
            });
            html += `</tr><tr>`;
            data.dates.forEach(() => {
                data.slots.forEach(s => { html += `<th>${s.replace("コマ", "")}</th>`; });
            });
            html += `</tr>`;

            // データ行（講師 × 日付 × コマ）
            data.teachers.forEach(teacher => {
                html += `<tr><td class="col-teacher">${teacher}</td>`;
                data.dates.forEach(date => {
                    data.slots.forEach(slot => {
                        // 🎯 ここがドロップゾーン（受け皿）
                        html += `<td class="drop-zone" data-teacher="${teacher}" data-date="${date}" data-slot="${slot}">`;
                        
                        // この枠に該当する授業を探してバッジを配置
                        const matchingLessons = lessonsData.filter(l => l.講師名 === teacher && l.日付 === date && l.コマ名 === slot);
                        matchingLessons.forEach(lesson => {
                            // 👤 ここがドラッグできる要素
                            html += `<div class="student-badge" draggable="true" data-id="${lesson.授業ID}">
                                        ${lesson.生徒名} (${lesson.科目})
                                     </div>`;
                        });
                        html += `</td>`;
                    });
                });
                html += `</tr>`;
            });
            html += `</table>`;
            container.innerHTML = html;
            attachDragAndDropEvents();
        }

        // 🚀 2. ドラッグ＆ドロップの動きを制御する関数
        function attachDragAndDropEvents() {
            const badges = document.querySelectorAll('.student-badge');
            const dropZones = document.querySelectorAll('.drop-zone');

            badges.forEach(badge => {
                badge.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', badge.dataset.id);
                    setTimeout(() => badge.style.opacity = '0.5', 0);
                });
                badge.addEventListener('dragend', (e) => {
                    badge.style.opacity = '1';
                });
            });

            dropZones.forEach(zone => {
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault(); // ドロップを許可
                    zone.classList.add('drag-over');
                });
                zone.addEventListener('dragleave', () => {
                    zone.classList.remove('drag-over');
                });
                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    zone.classList.remove('drag-over');
                    
                    const lessonId = e.dataTransfer.getData('text/plain');
                    const newTeacher = zone.dataset.teacher;
                    const newDate = zone.dataset.date;
                    const newSlot = zone.dataset.slot;

                    // データを更新
                    const targetLesson = lessonsData.find(l => l.授業ID === lessonId);
                    if (targetLesson && (targetLesson.講師名 !== newTeacher || targetLesson.日付 !== newDate || targetLesson.コマ名 !== newSlot)) {
                        targetLesson.講師名 = newTeacher;
                        targetLesson.日付 = newDate;
                        targetLesson.コマ名 = newSlot;
                        
                        // ✨ Python (Streamlit) 側に変更された最新データを送り返す！
                        Streamlit.setComponentValue(lessonsData);
                    }
                });
            });
        }

        // 🔗 3. Streamlitからデータを受け取った時の処理
        function onRender(event) {
            const data = event.detail.args.data; // Pythonから渡されたデータ
            renderBoard(data);
            Streamlit.setFrameHeight(document.documentElement.scrollHeight);
        }

        Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
        Streamlit.setComponentReady();
    </script>
</body>
</html>
